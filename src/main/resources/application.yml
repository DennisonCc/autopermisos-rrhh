server:
  port: 8080

spring:
  application:
    name: autopermisos-rrhh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autopermisos}
    username: ${DB_USERNAME:autopermisos}
    password: ${DB_PASSWORD:autopermisos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
